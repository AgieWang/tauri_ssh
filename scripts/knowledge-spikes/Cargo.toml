[package]
name = "knowledge-spikes"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
# Spike 只读取显式提供的离线模型包；ONNX Runtime 动态加载，避免基准过程隐式联网。
fastembed = { version = "=5.17.0", default-features = false, features = ["ort-load-dynamic"] }
rand = "0.8"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 下列依赖仅用于 macOS 技术验证，不进入桌面应用依赖树；正式锁定需在安全和夹具评估后另行确认。
ammonia = "4.1.4"
calamine = "0.36.1"
pdf-extract = "0.12.0"
quick-xml = "0.39.4"
scraper = { version = "0.24.0", default-features = false }
zip = { version = "6.0.0", default-features = false, features = ["deflate"] }
