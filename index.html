<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tauri SSH</title>
    <style>
      /* 首屏样式必须内联，避免主脚本下载和解析期间暴露 WebView 默认白色背景。 */
      :root {
        color-scheme: dark;
        --startup-bg: #1a1a1c;
        --startup-panel: #232325;
        --startup-text: #dcdcde;
        --startup-muted: #8a8a8d;
        --startup-accent: #5090f0;
      }

      @media (prefers-color-scheme: light) {
        :root {
          color-scheme: light;
          --startup-bg: #ffffff;
          --startup-panel: #f5f5f7;
          --startup-text: #1a1a2e;
          --startup-muted: #5c5c6e;
          --startup-accent: #2563eb;
        }
      }

      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
        background: var(--startup-bg);
      }

      .startup-shell {
        box-sizing: border-box;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 16px;
        width: 100%;
        height: 100%;
        padding: 24px;
        color: var(--startup-text);
        background: var(--startup-bg);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC",
          sans-serif;
      }

      .startup-shell-mark {
        display: grid;
        place-items: center;
        width: 48px;
        height: 48px;
        border-radius: 12px;
        color: white;
        background: var(--startup-accent);
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.08em;
        box-shadow: 0 8px 24px rgb(0 0 0 / 20%);
      }

      .startup-shell-copy {
        display: flex;
        flex-direction: column;
        gap: 4px;
        min-width: 148px;
      }

      .startup-shell-copy strong {
        font-size: 17px;
      }

      .startup-shell-copy span {
        color: var(--startup-muted);
        font-size: 13px;
      }

      .startup-shell-spinner {
        width: 18px;
        height: 18px;
        border: 2px solid var(--startup-panel);
        border-top-color: var(--startup-accent);
        border-radius: 50%;
        animation: startup-spin 0.8s linear infinite;
      }

      @keyframes startup-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .startup-shell-spinner {
          animation: none;
          border-color: var(--startup-accent);
        }
      }
    </style>
  </head>

  <body>
    <div id="root">
      <div class="startup-shell" role="status" aria-live="polite">
        <div class="startup-shell-mark" aria-hidden="true">SSH</div>
        <div class="startup-shell-copy">
          <strong>Tauri SSH</strong>
          <span>正在启动应用…</span>
        </div>
        <span class="startup-shell-spinner" aria-hidden="true"></span>
      </div>
    </div>
    <script type="module" src="/src/startup.ts"></script>
  </body>
</html>
