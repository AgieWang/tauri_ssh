<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Tauri SSH App Icon</title>
  <desc id="desc">A minimal AI SSH terminal icon with a secure terminal prompt and connected AI nodes.</desc>
  <defs>
    <linearGradient id="bg" x1="116" y1="88" x2="908" y2="936" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B1224"/>
      <stop offset="0.52" stop-color="#111827"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="plate" x1="246" y1="258" x2="808" y2="774" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1D4ED8"/>
      <stop offset="0.46" stop-color="#06B6D4"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="prompt" x1="350" y1="394" x2="700" y2="616" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#BAE6FD"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="34" stdDeviation="34" flood-color="#020617" flood-opacity="0.42"/>
    </filter>
    <filter id="cyanGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="18" flood-color="#22D3EE" flood-opacity="0.55"/>
    </filter>
    <clipPath id="rounded">
      <rect x="64" y="64" width="896" height="896" rx="224"/>
    </clipPath>
  </defs>

  <rect x="64" y="64" width="896" height="896" rx="224" fill="url(#bg)"/>
  <g clip-path="url(#rounded)" opacity="0.28">
    <path d="M168 256h688M168 384h688M168 512h688M168 640h688M168 768h688" stroke="#38BDF8" stroke-width="2"/>
    <path d="M256 168v688M384 168v688M512 168v688M640 168v688M768 168v688" stroke="#38BDF8" stroke-width="2"/>
  </g>

  <path d="M257 344c0-55 45-100 100-100h310c55 0 100 45 100 100v336c0 55-45 100-100 100H357c-55 0-100-45-100-100V344Z" fill="#07111F" filter="url(#softShadow)"/>
  <path d="M257 344c0-55 45-100 100-100h310c55 0 100 45 100 100v336c0 55-45 100-100 100H357c-55 0-100-45-100-100V344Z" fill="none" stroke="url(#plate)" stroke-width="34"/>
  <path d="M318 343c0-22 18-40 40-40h308c22 0 40 18 40 40v73H318v-73Z" fill="#0F172A"/>
  <circle cx="370" cy="360" r="15" fill="#22D3EE"/>
  <circle cx="420" cy="360" r="15" fill="#60A5FA"/>
  <circle cx="470" cy="360" r="15" fill="#A78BFA"/>

