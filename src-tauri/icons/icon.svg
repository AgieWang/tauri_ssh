  <path d="M540 642h146" stroke="url(#prompt)" stroke-width="54" stroke-linecap="round" filter="url(#cyanGlow)"/>

  <path d="M742 252c56 44 92 112 92 188 0 38-9 74-25 106" fill="none" stroke="#38BDF8" stroke-width="18" stroke-linecap="round" opacity="0.86"/>
  <path d="M282 774c-57-44-94-113-94-191 0-38 9-74 25-106" fill="none" stroke="#60A5FA" stroke-width="18" stroke-linecap="round" opacity="0.8"/>
